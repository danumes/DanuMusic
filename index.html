<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanuMusic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0a; color: white; min-height: 100vh; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        h1 { font-size: 24px; letter-spacing: -0.5px; }
        
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
        
        .track-list { display: flex; flex-direction: column; gap: 8px; }
        .track { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 12px; cursor: pointer; transition: background 0.3s; }
        .track:hover { background: rgba(255,255,255,0.05); }
        .track.active { background: rgba(255,255,255,0.1); }
        
        .cover { width: 50px; height: 50px; border-radius: 8px; background: linear-gradient(135deg, #a855f7, #ec4899); flex-shrink: 0; }
        .info { flex: 1; }
        .title { font-weight: 500; margin-bottom: 4px; }
        .artist { font-size: 13px; color: rgba(255,255,255,0.5); }
        
        .player { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 24px; backdrop-filter: blur(20px); position: sticky; top: 20px; height: fit-content; }
        .player-cover { width: 100%; aspect-ratio: 1; border-radius: 16px; background: linear-gradient(135deg, #a855f7, #ec4899); margin-bottom: 20px; }
        .player-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .player-artist { color: rgba(255,255,255,0.5); margin-bottom: 20px; }
        
        .progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 20px; cursor: pointer; }
        .progress { height: 100%; background: white; border-radius: 2px; width: 0%; transition: width 0.1s; }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
        .btn:hover { opacity: 1; }
        .btn-play { width: 56px; height: 56px; border-radius: 50%; background: white; color: black; font-size: 20px; display: flex; align-items: center; justify-content: center; opacity: 1; }
        .btn-play:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <h1>DanuMusic</h1>
    </header>

    <div class="container">
        <div class="track-list" id="trackList"></div>
        
        <div class="player">
            <div class="player-cover"></div>
            <div class="player-title" id="playerTitle">Выбери трек</div>
            <div class="player-artist" id="playerArtist">DanuMusic</div>
            
            <div class="progress-bar" onclick="seek(event)">
                <div class="progress" id="progress"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="prevTrack()">⏮</button>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="btn" onclick="nextTrack()">⏭</button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        // ВАЖНО: Замени ссылки на свои файлы, когда они появятся.
        // Пока это заглушки — музыка играть не будет, но интерфейс работает.
        const tracks = [
            { title: 'Midnight Drive', artist: 'Demo Artist', src: '' },
            { title: 'Neon Lights', artist: 'Demo Artist', src: '' },
            { title: 'Ocean Eyes', artist: 'Demo Artist', src: '' }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        const audio = document.getElementById('audio');

        function renderTracks() {
            const list = document.getElementById('trackList');
            list.innerHTML = tracks.map((track, i) => `
                <div class="track ${i === currentIndex ? 'active' : ''}" onclick="selectTrack(${i})">
                    <div class="cover"></div>
                    <div class="info">
                        <div class="title">${track.title}</div>
                        <div class="artist">${track.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function selectTrack(index) {
            currentIndex = index;
            const track = tracks[index];
            document.getElementById('playerTitle').textContent = track.title;
            document.getElementById('playerArtist').textContent = track.artist;
            
            if (track.src) {
                audio.src = track.src;
                audio.play().catch(() => {}); // Игнорируем ошибку, если файла нет
                isPlaying = true;
                updatePlayBtn();
            }
            renderTracks();
        }

        function togglePlay() {
            if (!audio.src) {
                selectTrack(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play().catch(() => {});
            }
            isPlaying = !isPlaying;
            updatePlayBtn();
        }

        function updatePlayBtn() {
            document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
        }

        function nextTrack() {
            selectTrack((currentIndex + 1) % tracks.length);
        }

        function prevTrack() {
            selectTrack((currentIndex - 1 + tracks.length) % tracks.length);
        }

        function seek(e) {
            if (!audio.duration) return;
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = percent + '%';
        });

        audio.addEventListener('ended', nextTrack);

        renderTracks();
    </script>
</body>
</html>
